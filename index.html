<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
</head>
<body>
<title>OMS Faces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@1,6..72,500&display=swap">
<style>
:root{
  --ground:#F2F4EF; --surface:#FFFFFF; --surface-2:#E8ECE5; --ink:#1C2420; --muted:#5E6A62;
  --line:#D5DBD3; --accent:#3B6A4E; --accent-ink:#FFFFFF; --clay:#B4603A; --clay-ink:#FFFFFF;
  --shadow:0 10px 30px rgba(28,36,32,.10), 0 1px 2px rgba(28,36,32,.08);
  --focus:#3B6A4E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151B17; --surface:#1E2621; --surface-2:#273029; --ink:#E7EBE5; --muted:#98A59C;
    --line:#35403A; --accent:#86B896; --accent-ink:#0F1A13; --clay:#DB8F68; --clay-ink:#1A0E07;
    --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3); --focus:#86B896;
  }
}
:root[data-theme="dark"]{
  --ground:#151B17; --surface:#1E2621; --surface-2:#273029; --ink:#E7EBE5; --muted:#98A59C;
  --line:#35403A; --accent:#86B896; --accent-ink:#0F1A13; --clay:#DB8F68; --clay-ink:#1A0E07;
  --shadow:0 10px 30px rgba(0,0,0,.35), 0 1px 2px rgba(0,0,0,.3); --focus:#86B896;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;padding-block:14px 32px;padding-inline:16px;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:"Newsreader",Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;font-size:26px;letter-spacing:-.01em;line-height:1}
.brand small{font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-style:normal;font-weight:400;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-left:8px}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.modes{display:grid;grid-template-columns:1fr 1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.modes button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:8px 6px;border-radius:8px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.modes button:focus-visible,.grade button:focus-visible,.card:focus-visible,.link:focus-visible,.summary button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.stage{perspective:1400px}
.card{position:relative;width:100%;min-height:440px;border:0;padding:0;background:transparent;cursor:pointer;text-align:left;font:inherit;color:inherit;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.face.back{transform:rotateY(180deg)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.photo{width:100%;max-width:236px;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:var(--surface-2);align-self:center;display:block}
.photo.small{max-width:132px}
.ph{width:100%;max-width:236px;aspect-ratio:3/4;border-radius:8px;background:var(--surface-2);align-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.ph.small{max-width:132px}
.ph b{font-size:34px;letter-spacing:.06em;color:var(--ink);opacity:.55}
.ph span{font-size:12px}
.name{font-size:26px;font-weight:700;line-height:1.12;text-wrap:balance;margin:0}
.name.big{font-size:30px;margin-top:auto;margin-bottom:auto;text-align:center}
.role{font-size:14px;color:var(--muted);margin:0}
.lines{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14.5px;line-height:1.4;max-width:38em}
.hint{margin-top:auto;font-size:13px;color:var(--muted);text-align:center}
.cue{margin-top:auto}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade button{appearance:none;border:0;font:inherit;font-size:16px;font-weight:700;padding:14px 10px;border-radius:12px;cursor:pointer;transition:transform .08s ease}
.grade button:active{transform:translateY(1px)}
.grade .unsure{background:var(--clay);color:var(--clay-ink)}
.grade .got{background:var(--accent);color:var(--accent-ink)}
.grade button[disabled]{opacity:.35;cursor:default}
.keys{font-size:12px;color:var(--muted);text-align:center}
.keys kbd{font:inherit;border:1px solid var(--line);border-radius:4px;padding:0 4px}

.summary{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.summary h2{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:500;font-size:28px;margin:0;line-height:1.1}
.summary p{margin:0;color:var(--muted)}
.summary .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip.missed{background:color-mix(in srgb,var(--clay) 18%,var(--surface))}
.summary button{appearance:none;border:0;font:inherit;font-size:15px;font-weight:700;padding:12px;border-radius:12px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.summary button.secondary{background:var(--surface-2);color:var(--ink)}

.browse{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);padding:10px;display:flex;flex-direction:column;gap:6px}
.tile img,.tile .ph{max-width:100%;border-radius:6px}
.tile .ph b{font-size:26px}
.tile .n{font-weight:700;font-size:15px;line-height:1.15;text-wrap:balance}
.tile .r{font-size:12px;color:var(--muted)}
.tile .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.section{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);grid-column:1/-1;margin-top:4px}

footer{font-size:12px;color:var(--muted);line-height:1.45;display:flex;flex-direction:column;gap:6px}
.link{appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:0;align-self:flex-start}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){.card{transition:none}.grade button{transition:none}}
@media (max-width:380px){.name{font-size:23px}.name.big{font-size:26px}.brand{font-size:23px}}
</style>

<div class="wrap">
  <header>
    <div class="brand">OMS Faces<small>Staff cards</small></div>
    <div class="count" id="count"></div>
  </header>

  <div class="modes" role="group" aria-label="Mode">
    <button id="mode-picture" aria-pressed="true">Picture card</button>
    <button id="mode-label" aria-pressed="false">Label card</button>
    <button id="mode-browse" aria-pressed="false">Everyone</button>
  </div>

  <div id="drill">
    <div class="stage">
      <button class="card" id="card" aria-label="Flashcard, tap to flip">
        <div class="face front" id="front"></div>
        <div class="face back" id="back"></div>
      </button>
    </div>
    <div class="grade" style="margin-top:14px">
      <button class="unsure" id="btn-unsure" disabled>Unsure</button>
      <button class="got" id="btn-got" disabled>Got it</button>
    </div>
    <div class="keys" style="margin-top:8px"><kbd>Space</kbd> flip &nbsp;·&nbsp; <kbd>1</kbd> unsure &nbsp;·&nbsp; <kbd>2</kbd> got it</div>
  </div>

  <div id="summary" class="summary" hidden></div>

  <div id="browse" class="browse" hidden></div>

  <footer>
    <div>Modeled on Montessori three-part cards: the picture card asks for the name, the label card asks for the face, and the flip is the control card. Unsure cards come back a few turns later; got-it cards leave the round.</div>
    <div id="stats"></div>
    <button class="link" id="reset">Clear saved progress on this device</button>
  </footer>
</div>

const KEY = "omsfaces.v1";
const TEACHERS = DATA.filter(p => !p.role.startsWith("Aide"));
const AIDES = DATA.filter(p => p.role.startsWith("Aide"));

let store = {stats:{}, mode:"picture"};
try { const s = localStorage.getItem(KEY); if (s) store = Object.assign(store, JSON.parse(s)); } catch(e){}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} }

let mode = store.mode || "picture";
let queue = [], flipped = false, roundGot = [], roundUnsure = [], roundSize = 0;

const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function photoNode(p, small){
  if (p.photo){ const i = el("img","photo"+(small?" small":"")); i.src = p.photo; i.alt = ""; return i; }
  const d = el("div","ph"+(small?" small":"")); d.innerHTML = `<b>${p.initials}</b><span>No photo on file</span>`; return d;
}
function linesNode(p, hideName){
  let lines = p.lines;
  if (hideName){
    const toks = p.name.replace(/[“”"]/g," ").split(/[\s-]+/).filter(t => t.length > 2).map(t => t.toLowerCase());
    lines = lines.filter(l => !toks.some(t => l.toLowerCase().includes(t)));
  }
  const ul = el("ul","lines"); lines.forEach(l => ul.appendChild(el("li",null,esc(l)))); return ul;
}
function seenText(p){ const s = store.stats[p.id]; if (!s || !(s.got||s.unsure)) return "First time"; return `Got it ${s.got||0}, unsure ${s.unsure||0}`; }

function renderCard(){
  const p = DATA.find(x => x.id === queue[0]);
  const front = $("front"), back = $("back");
  front.innerHTML = ""; back.innerHTML = "";
  const left = queue.length;
  const eyebrowF = el("div","eyebrow",`<span>${mode === "picture" ? "Who is this?" : "Picture the face"}</span><span>${left} left</span>`);
  const eyebrowB = el("div","eyebrow",`<span>${esc(p.role)} · ${esc(p.since)}</span><span>${esc(seenText(p))}</span>`);
  front.appendChild(eyebrowF);
  if (mode === "picture"){
    if (p.photo){ front.appendChild(photoNode(p,false)); }
    else {
      const cue = el("div","cue");
      cue.appendChild(el("p","role",`${esc(p.role)} · ${esc(p.since)} · no photo on file, so go by the details`));
      cue.appendChild(linesNode(p, true));
      front.appendChild(cue);
    }
    front.appendChild(el("div","hint","Tap to reveal"));
    back.appendChild(eyebrowB);
    back.appendChild(photoNode(p,true));
    back.appendChild(el("h2","name",esc(p.name)));
    back.appendChild(linesNode(p));
  } else {
    front.appendChild(el("h2","name big",esc(p.name)));
    front.appendChild(el("div","hint","Tap to check"));
    back.appendChild(eyebrowB);
    back.appendChild(photoNode(p,false));
    back.appendChild(el("h2","name",esc(p.name)));
    back.appendChild(linesNode(p));
  }
  flipped = false; $("card").classList.remove("flipped");
  fitCard();
  $("btn-unsure").disabled = true; $("btn-got").disabled = true;
  $("count").textContent = `${roundSize - left + 1} of ${roundSize}`;
}

function fitCard(){
  const c = $("card"); c.style.minHeight = "";
  const h = Math.max($("front").scrollHeight, $("back").scrollHeight, 440);
  c.style.minHeight = h + "px";
}
window.addEventListener("resize", () => { if (!$("drill").hidden && queue.length) fitCard(); });
function startRound(ids){
  queue = shuffle(ids.slice()); roundSize = queue.length; roundGot = []; roundUnsure = [];
  $("summary").hidden = true; $("drill").hidden = false; $("browse").hidden = true;
  renderCard();
}

function flip(){ if (!queue.length) return; flipped = !flipped; $("card").classList.toggle("flipped", flipped); $("btn-unsure").disabled = !flipped; $("btn-got").disabled = !flipped; }

function grade(got){
  if (!flipped || !queue.length) return;
  const id = queue.shift();
  const s = store.stats[id] = store.stats[id] || {got:0, unsure:0};
  if (got){ s.got++; roundGot.push(id); }
  else { s.unsure++; if (!roundUnsure.includes(id)) roundUnsure.push(id); const pos = Math.min(queue.length, 3); queue.splice(pos, 0, id); }
  save(); renderStats();
  if (queue.length) renderCard(); else showSummary();
}

function showSummary(){
  $("drill").hidden = true; const s = $("summary"); s.hidden = false; s.innerHTML = "";
  const clean = roundSize - roundUnsure.length;
  s.appendChild(el("h2",null, roundUnsure.length ? `${clean} of ${roundSize} on the first try` : `All ${roundSize}, first try`));
  s.appendChild(el("p",null, roundUnsure.length ? "These needed a second look:" : "Nothing to review. Run it again tomorrow to keep them."));
  if (roundUnsure.length){
    const chips = el("div","chips");
    roundUnsure.forEach(id => { const p = DATA.find(x => x.id === id); chips.appendChild(el("span","chip missed",esc(p.name))); });
    s.appendChild(chips);
    const b = el("button",null,`Review the ${roundUnsure.length} you missed`); b.onclick = () => startRound(roundUnsure); s.appendChild(b);
  }
  const b2 = el("button", roundUnsure.length ? "secondary" : null, "Run everyone again"); b2.onclick = () => startRound(DATA.map(p => p.id)); s.appendChild(b2);
  $("count").textContent = "Round done";
}

function renderBrowse(){
  const g = $("browse"); g.innerHTML = "";
  const add = (label, list) => { g.appendChild(el("div","section",label)); list.forEach(p => {
    const t = el("div","tile"); t.appendChild(photoNode(p,false));
    t.appendChild(el("div","n",esc(p.name))); t.appendChild(el("div","r",`${esc(p.role)} · ${esc(p.since)}`));
    t.appendChild(el("div","s",esc(seenText(p)))); g.appendChild(t); }); };
  add("Teachers", TEACHERS); add("Aides", AIDES);
}

function setMode(m){
  mode = m; store.mode = m; save();
  ["picture","label","browse"].forEach(x => $("mode-"+x).setAttribute("aria-pressed", String(x === m)));
  if (m === "browse"){ $("drill").hidden = true; $("summary").hidden = true; $("browse").hidden = false; renderBrowse(); $("count").textContent = `${DATA.length} people`; }
  else startRound(DATA.map(p => p.id));
}

function renderStats(){
  const seen = DATA.filter(p => store.stats[p.id] && (store.stats[p.id].got || store.stats[p.id].unsure)).length;
  const solid = DATA.filter(p => { const s = store.stats[p.id]; return s && s.got >= 3 && s.got > 2*(s.unsure||0); }).length;
  $("stats").textContent = seen ? `Seen ${seen} of ${DATA.length} so far; ${solid} look solid (got it three or more times, rarely unsure).` : "No progress saved yet.";
}

$("card").addEventListener("click", flip);
$("btn-unsure").addEventListener("click", () => grade(false));
$("btn-got").addEventListener("click", () => grade(true));
$("mode-picture").addEventListener("click", () => setMode("picture"));
$("mode-label").addEventListener("click", () => setMode("label"));
$("mode-browse").addEventListener("click", () => setMode("browse"));
$("reset").addEventListener("click", () => { store.stats = {}; save(); renderStats(); if (mode === "browse") renderBrowse(); });
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.key === " " || e.key === "Enter" && e.target.id === "card") { if ($("drill").hidden) return; e.preventDefault(); flip(); }
  else if (e.key === "1") grade(false);
  else if (e.key === "2") grade(true);
});

function start(){ renderStats(); setMode(mode === "browse" ? "picture" : mode); }
start();
</script>
